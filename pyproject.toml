[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ado-agile-metrics"
version = "0.1.0"
description = "Configurable Azure DevOps Agile metrics portal"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.42",
    "plotly>=6.0",
    "pandas>=2.2",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "kaleido>=0.2",
    "cryptography>=43.0",
    "keyring>=25.0",
    "reportlab>=4.2",
    "python-pptx>=1.0",
    "msal>=1.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
